name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Gradle project
        id: find
        run: |
          echo "Repo files:"; git ls-files | head -40
          F=$(find . -not -path './.git/*' \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::Repo has no build.gradle/settings.gradle. Commit the mod files (build.gradle, settings.gradle, gradle.properties, src/) - the yml cannot build without them."
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
